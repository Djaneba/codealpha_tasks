{% extends "base.html" %}{% block title %}Search{% endblock %}{% block content %}
<form><input name="q" value="{{ q }}" maxlength="100"><button>Search</button></form>
{% if q %}<p>Results for: {{ q }}</p><ul>{% for r in results %}
<li><a href="{{ url_for('view_note', note_id=r['id']) }}">{{ r['title'] }}</a></li>{% else %}<li>No match.</li>{% endfor %}</ul>{% endif %}
{% endblock %}

{% extends "base.html" %}{% block title %}My notes{% endblock %}{% block content %}
<ul>{% for n in notes %}<li><a href="{{ url_for('view_note', note_id=n['id']) }}">{{ n['title'] }}</a>: {{ n['body'] }}</li>
{% else %}<li>No notes yet.</li>{% endfor %}</ul>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="title" maxlength="120" required><textarea name="body" maxlength="5000"></textarea>
  <button>Add</button>
</form>{% endblock %}
